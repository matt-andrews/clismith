name: billing
display: Billing
about: The billing API

commands:
  - module: billing
    resource: health
    verb: get
    route: /health
    method: GET

  - module: billing
    resource: customers
    verb: get
    about: Get a customer by id
    route: /customers/{{id}}
    method: GET
    args:
      - name: id
        required: true
        type: int
        where: route

  - module: billing
    resource: customers
    verb: list
    about: Returns all customers. Optionally filter by a case-insensitive search on name, email or company.
    route: /customers
    method: GET
    args:
      - name: search
        type: string
        where: query
