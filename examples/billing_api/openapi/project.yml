name: test
display: Test
about: something something darkside...
profiles: [prod, staging, local]

grammar:
  pattern: "{ module } { resource? } { verb }"
  naming:
    case: kebab
  verbs:
    - { method: GET, target: item, verb: get }
    - { method: GET, target: collection, verb: list }
    - { method: POST, target: item, verb: create }

required_modules:
  - { module: manifest, version: "*" }
  - { module: billing, version: "*" }

registries:
  - index: "lfs://../examples/billing_api/openapi/target/index.json"
    secure: false

global_flags:
  - long: verbose
    short: v
    type: bool
    about: "Enable verbose logging"
    target: "SYS_FLAG_VERBOSE"

  - long: head
    short: I
    type: bool
    about: "Force the output to be request headers instead of content"
    target: "SYS_FLAG_HEAD"

  - long: output
    short: o
    choices: [json, table, none]
    default: json
    about: "Set the printed structure"
    target: "SYS_FLAG_OUTPUT"

  - long: output-prop
    about: "Select which properties are output"
    target: "SYS_FLAG_OUTPUT_PROP"
    multiple: true

  - long: output-sort
    about: "Sort output by given property. Prefix the property with `-` for descending"
    target: "SYS_FLAG_OUTPUT_SORT"
    multiple: true
    allow_hyphen_values: true
